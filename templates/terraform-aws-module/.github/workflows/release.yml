# release-please keeps a release pull request open on main with the next
# version and its CHANGELOG entry. Merging it tags vX.Y.Z and publishes a
# GitHub release; the HCP Terraform private registry publishes the module
# from the tag. Nothing here applies infrastructure.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
