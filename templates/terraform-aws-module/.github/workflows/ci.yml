# The gate for every pull request and every push to main. Each job proves one
# thing; together they are what CONTRIBUTING.md promises a reviewer.
#
# Third-party actions are pinned to a commit SHA, with the release as a
# comment: a tag can be moved, a SHA cannot. Dependabot proposes updates,
# after a 14-day cooldown (.github/dependabot.yml).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  # Both ends of the supported ranges. The floor matters twice: Terraform 1.9
  # evaluates both operands of || and &&, and aws 5.x lacks arguments 6.x has.
  test:
    name: test (terraform ${{ matrix.terraform }}, aws ${{ matrix.aws }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.8", "latest"]
        aws: ["5.100.0", "6.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Pin the provider to the v5 end
        if: matrix.aws == '5.100.0'
        run: |
          sed -i 's/version = ">= 5.90.0, < 7.0.0"/version = "= 5.100.0"/' versions.tf
          grep -q '"= 5.100.0"' versions.tf || { echo "::error::versions.tf changed shape; update this step"; exit 1; }
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
      - name: Examples validate
        run: |
          for d in examples/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  lint:
    name: tflint and the repository's own linters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          # Plugin downloads are rate-limited without a token.
          GITHUB_TOKEN: ${{ github.token }}
      # A guard nobody proved is a guard nobody should trust: each linter
      # first reintroduces its defects and checks it catches them.
      - run: python3 tests/lint_validations.py --self-test
      - run: python3 tests/lint_validations.py .
      - run: python3 tests/check_consistency.py --self-test
      - run: python3 tests/check_consistency.py .

  security:
    name: trivy config scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Accepted findings live in .trivyignore, each with its reason.
          trivyignores: .trivyignore
