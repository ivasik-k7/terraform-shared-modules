# Squash merges use the pull request title as the commit message on main, so
# the title is the changelog line: type(module): subject. A "!" after the
# scope marks a change that alters an unchanged caller's plan.

name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            refactor
            perf
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: 'Start the subject with a lowercase letter and do not end it with a period: "{subject}".'
